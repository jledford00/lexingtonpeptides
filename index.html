<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexington Peptides</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="top-band">
      <h1>LEXINGTON</h1>
    </div>

    <div class="middle-band">
      <div class="pill-logo">PEPTIDES</div>
      <div class="flask-wrap">
        <img src="images/flask.png" alt="Flask icon" class="flask-icon" />
      </div>
    </div>
  </header>

  <main class="content">
    <h2>Peptides &amp; Research Products</h2>

    <section class="product-grid">
      <div class="product-card">
        <img src="images/semaglutide.png" alt="Semaglutide" />
        <p>Semaglutide</p>
      </div>

      <div class="product-card">
        <img src="images/tirzepatide.png" alt="Tirzepatide" />
        <p>Tirzepatide</p>
      </div>

      <div class="product-card">
        <img src="images/bpc157.png" alt="BPC 157" />
        <p>BPC 157</p>
      </div>

      <div class="product-card">
        <img src="images/tb500.png" alt="TB 500" />
        <p>TB 500</p>
      </div>

      <div class="product-card">
        <img src="images/ipamorelin.png" alt="Ipamorelin" />
        <p>Ipamorelin</p>
      </div>

      <div class="product-card">
        <img src="images/cjc1295.png" alt="CJC-1295 Without DAC" />
        <p>CJC-1295<br />Without DAC</p>
      </div>

      <div class="product-card">
        <img src="images/cagrilintide.png" alt="Cagrilintide" />
        <p>Cagrilintide</p>
      </div>

      <div class="product-card">
        <img src="images/ghkcu.png" alt="GHK-Cu" />
        <p>GHK-Cu</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </footer>
</body>
</html>
